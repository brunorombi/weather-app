<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <h1>Weather App</h1>
      <form novalidate>
        <input type="text" placeholder="Enter a city" required />
        <span class="error"></span>
        <button>Search</button>
      </form>
      <div id="content">
        <div id="weather">
          <h2 class="city">Sao Paulo</h2>
          <div>
            <h2 class="temp">21</h2>
            <p class="description">Similar temperatures continuing with a chance of rain multiple days.</p>
          </div>
        </div>
        <div id="info">
          <h1 class="time">13:48</h1>
          <p class="date">Saturaday 1 December 2026</p>
        </div>
      </div>
    </div>
  </body>
</html>
